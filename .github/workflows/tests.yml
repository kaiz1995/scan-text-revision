name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        opencv: [with-opencv, numpy-only]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System packages (CJK fonts, OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk tesseract-ocr tesseract-ocr-chi-sim
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow numpy pikepdf
          if [ "${{ matrix.opencv }}" = "with-opencv" ]; then python -m pip install opencv-python-headless; fi
      - name: Compile
        run: python -m py_compile scripts/*.py
      - name: Tests
        run: python -m unittest discover -s tests -v
